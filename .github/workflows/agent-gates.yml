name: Agent Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  contract:
    name: Agent contract / scope gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate PR metadata and classify changed areas
        run: node tools/agent-pipeline/classify-pr.mjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
