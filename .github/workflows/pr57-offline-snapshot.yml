name: PR57 publish verified repair objects
on:
  push:
    branches: [chore/sc-ops-002d-feedback-loop]
    paths: [.github/workflows/pr57-offline-snapshot.yml, .github/agent-pipeline/pr57-direct-repair.py, tests/agent-pipeline/feedback-review-regressions.test.mjs]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'krzysztofsyska/skillcheck-core' && github.ref == 'refs/heads/chore/sc-ops-002d-feedback-loop' && github.actor_id == '222297538'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: input
      - uses: actions/checkout@v4
        with:
          ref: 5db4968e71f16253a39fc7811f58cc9cc677237e
          fetch-depth: 0
          persist-credentials: false
          path: code
      - name: Reproduce the locally verified merge and repair
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='SkillCheck repair' -c user.email='repair@localhost' merge --no-commit --no-ff dc4d20240568669a514480e387687c49194d5267
          test "$(git write-tree)" = bbd1b07cac00b2f559350b464995e442c1255b24
          python3 ../input/.github/agent-pipeline/pr57-direct-repair.py
          cp ../input/tests/agent-pipeline/feedback-review-regressions.test.mjs tests/agent-pipeline/feedback-review-regressions.test.mjs
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = fd15dde06d22c1facb9ca8f4a73f11842a26b2da
      - name: Publish Git objects only, never update a branch
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const git = (...args) => execFileSync('git', args, {cwd: 'code', encoding:'utf8'}).trim();
            const target = 'fd15dde06d22c1facb9ca8f4a73f11842a26b2da';
            if (git('write-tree') !== target) throw new Error('TREE_MISMATCH');
            const paths = execFileSync('git', ['diff','--cached','--name-only','-z','5db4968e71f16253a39fc7811f58cc9cc677237e'], {cwd:'code',encoding:'utf8'}).split('\0').filter(Boolean);
            const tree = [];
            for (const path of paths) {
              const entry = git('ls-files','--stage','--',path);
              if (!entry) { tree.push({path,mode:'100644',type:'blob',sha:null}); continue; }
              const [mode,sha] = entry.split(/\s+/);
              const bytes = execFileSync('git',['cat-file','blob',sha],{cwd:'code'});
              const made = await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              if(made.data.sha !== sha) throw new Error('BLOB_MISMATCH');
              tree.push({path,mode,type:'blob',sha});
            }
            const made = await github.rest.git.createTree({...context.repo,base_tree:'ffca9395d39139f669a2a9bb5a54671b1104ad06',tree});
            if(made.data.sha !== target) throw new Error('PUBLISHED_TREE_MISMATCH');
            core.info('VERIFIED_REPAIR_TREE=' + made.data.sha);
            await core.summary.addRaw('Verified Git tree: `' + made.data.sha + '`. No branch ref, PR merge, environment, provider or deployment was changed.').write();
