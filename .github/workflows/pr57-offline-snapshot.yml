name: PR57 verify deadline repair objects
on:
  push:
    branches: [chore/sc-ops-002d-feedback-loop]
    paths: [.github/workflows/pr57-offline-snapshot.yml, .github/agent-pipeline/pr57-deadlines.patch]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'krzysztofsyska/skillcheck-core' && github.ref == 'refs/heads/chore/sc-ops-002d-feedback-loop' && github.actor_id == '222297538'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: input
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: code
          ref: 8f6f012b98909da9e6b9019f7a4d51a1909ccc6f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the exact tested tree
        working-directory: code
        run: |
          set -eu
          test "$(git rev-parse HEAD^{tree})" = c73adffa93780a394eb846399069796d76073e60
          git apply --index ../input/.github/agent-pipeline/pr57-deadlines.patch
          git diff --cached --check
          test "$(git write-tree)" = 23166e11e3f8585533fb210a37f7b81e6b75ed3c
          node --test tests/agent-pipeline/*.test.mjs
      - name: Publish verified Git objects without changing any ref
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync}=require('node:child_process');
            const git=(...a)=>execFileSync('git',a,{cwd:'code',encoding:'utf8'}).trim();
            const expected='23166e11e3f8585533fb210a37f7b81e6b75ed3c';
            if(git('write-tree')!==expected) throw Error('TREE_MISMATCH');
            const paths=execFileSync('git',['diff','--cached','--name-only','-z'],{cwd:'code',encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed=['docs/sc-ops-002d-feedback.md','tests/agent-pipeline/feedback-review-regressions.test.mjs','tests/agent-pipeline/feedback.test.mjs','tools/agent-pipeline/feedback.mjs'];
            if(paths.length!==4||paths.some(p=>!allowed.includes(p))) throw Error('SCOPE_MISMATCH');
            const tree=[];
            for(const path of paths){
              const [mode,sha]=git('ls-files','--stage','--',path).split(/\s+/);
              const bytes=execFileSync('git',['cat-file','blob',sha],{cwd:'code'});
              const blob=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              if(blob.data.sha!==sha) throw Error('BLOB_MISMATCH');
              tree.push({path,mode,type:'blob',sha});
            }
            const result=await github.rest.git.createTree({...context.repo,base_tree:'c73adffa93780a394eb846399069796d76073e60',tree});
            if(result.data.sha!==expected) throw Error('PUBLISHED_TREE_MISMATCH');
            core.info('VERIFIED_REPAIR_TREE='+result.data.sha);
            await core.summary.addRaw('Verified tree '+result.data.sha+'. No ref, merge, environment, provider or deployment changed.').write();
