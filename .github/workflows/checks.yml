name: Checks
on:
  push:
    branches:
      - main
      - integration
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/vercel-deployment-policy.test.mjs
      - run: node --test tests/release-promotion-manifest.test.mjs
      - run: node --test tests/production-approval-attestation.test.mjs
      - run: node --test tests/deploy-screening-worker-workflow.test.mjs
      - run: node --test tests/preview-db-migrate-workflow.test.mjs
        env:
          PREVIEW_MIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: node --test tests/cv-bulk-workflows.test.mjs
      - run: npm run test:fakturownia
      - run: npm run typecheck
      - run: npm run test:legal
      - run: npm run test:db
        env:
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_PG_MAJOR: '16'
      - run: npm run test:company-limit-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:retention-scheduler
      - run: npm run test:retention-scheduler-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:sales-leads
        env:
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_PG_MAJOR: '16'
      - run: npm run test:sales-pipeline
        env:
          SALES_PIPELINE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:sales-mail
        env:
          SALES_MAIL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:auth
      - run: npm run test:cv
      # Unit tests; the native-PostgreSQL suite (needs full git history) runs in sc19-migrations.yml (PG 16/17).
      - run: npm run test:cv-bulk
      - run: npm run test:screening
      - run: node --test tests/sc-019-billing-prototype.test.mjs tests/sc-019-billing-ui.test.mjs
      - run: node --test tests/sc-019-package-display.test.mjs
      - run: node --experimental-strip-types --test tests/sc-019-operator-ui.test.mjs
      - run: node --test tests/sc-019-billing-concurrency.test.mjs
        env:
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: node --test tests/sc-019-erasure-baseline.test.mjs
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:screening-report
      - run: npm run test:screening-joint
      - run: npm run test:communication
      - run: npm run test:contact-verification
      - run: npm run test:erasure-preview
      - run: npm run test:erasure-lifecycle
      - run: npm run test:erasure-execution
      - run: npm run test:erasure-service
      - run: npm run test:erasure-execution-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          ERASURE_LEDGER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:erasure-lifecycle-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:erasure-preview-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:contact-verification-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:communication-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:screening-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:screening-ranking
      - run: npm run test:screening-ranking-concurrency
        env:
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:assessments
      - run: npm run test:live-check
      - run: npm run test:behavior-guide
      - run: npm run test:behavior-assessments
      - run: npm run test:agent-pipeline
      - run: npm run build
      - run: npm run test:pdf-bundle
      - run: npm run test:http
      - run: npm run test:screening-report-http
      - run: npm run test:auth-http
      - run: npm run test:marketing
      - run: node --test tests/sc-019-package-http.test.mjs
      - run: npm run test:sales-leads-http
      - run: npm run test:sales-pipeline-http
      - run: npm run test:sales-leads-operator
