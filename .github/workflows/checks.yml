name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run test:auth
      - run: npm run test:cv
      - run: npm run test:screening
      - run: npm run test:assessments
      - run: npm run test:live-check
      - run: npm run build
      - run: npm run test:pdf-bundle
      - run: npm run test:http
      - run: npm run test:auth-http
