name: SC Pricing Catalog Prototype
on:
  pull_request:
    paths:
      - 'db/isolated/sc-pricing-catalog.sql'
      - 'tests/sc-pricing-catalog.test.mjs'
      - '.github/workflows/sc-pricing-catalog.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/sc-pricing-catalog.test.mjs
        env:
          SC_PRICING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run build
