name: Claude Code task dispatcher
on:
  workflow_dispatch:
    inputs:
      task:
        description: Approved issue number
        required: true
        type: choice
        options: ['21', '81']
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  id-token: write

concurrency:
  group: claude-task-${{ github.event.issue.number || inputs.task }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.repository == 'krzysztofsyska/skillcheck-core' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'issues' && github.event.label.name == 'claude-code-ready' &&
        (github.event.issue.number == 21 || github.event.issue.number == 81) &&
        github.event.sender.login == 'krzysztofsyska'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: claude-code-development
    steps:
      - name: Require configured authentication
        env:
          HAS_API: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_API" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            echo "::error::Claude Code credential missing. Configure protected environment secret before running."
            exit 1
          fi
      - name: Claude Code implement approved task
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: integration
          additional_permissions: |
            actions: read
          prompt: |
            Read AGENTS.md and CLAUDE.md on the trusted integration branch.
            Implement ONLY the next unimplemented and dependency-ready stage of
            GitHub issue #${{ github.event.issue.number || inputs.task }}.
            Approved tasks: #21 SC-020 client-only white-label and #81 SC-021
            provider-neutral gateway with OpenAI as the only active provider.
            Check existing PRs and branches first, avoid duplication.
            Create a task branch from integration; implement code, unit tests
            and security tests, commit and prepare a draft PR to integration.
            Never modify main, production, repo settings, secrets, DNS or
            payment services. Do not contact candidates or incur new charges
            outside existing approved credentials. Do not merge any PR.
            Report commit SHA, CI and blockers to the issue.
          claude_args: |
            --max-turns 12
