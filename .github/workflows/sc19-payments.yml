name: SC-019 payments offline contracts
on:
  pull_request:
    paths:
      - 'lib/sc19-payments.ts'
      - 'tests/sc-019-payments.test.mjs'
      - 'docs/sc19-payments-handoff.md'
      - '.github/workflows/sc19-payments.yml'
  push:
    branches: [feat/sc19-payment-core-20261016]
permissions:
  contents: read
jobs:
  payment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --experimental-strip-types --test tests/sc-019-payments.test.mjs
