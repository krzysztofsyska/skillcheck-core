# PREPARATION-ONLY regression. Not a required Production check, not an approval.
# A future production gate MUST execute from a trusted protected main revision.
name: Sales Release Scope
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [integration]
    paths:
      - 'tools/agent-pipeline/lib/sales-release.mjs'
      - 'tools/agent-pipeline/classify-pr.mjs'
      - 'tests/agent-pipeline/sales-release-gate.test.mjs'
      - '.github/workflows/sales-release-scope.yml'
      - 'docs/sales-mvp-selective-release.md'
      - 'AGENTS.md'
permissions:
  contents: read
jobs:
  scope:
    name: Sales release offline deny-matrix tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test tests/agent-pipeline/sales-release-gate.test.mjs
