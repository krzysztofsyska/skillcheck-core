permissions:
  contents: read
jobs:
  migration-contract:
    name: Migrations / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Matching native dump and restore clients
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          if [ ! -x "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" ]; then
            sudo apt-get update
            if ! apt-cache show "postgresql-client-$PG_MAJOR" >/dev/null 2>&1; then
              # Official PGDG repository; Ubuntu's default packages may only
              # include PG16. Install clients, never another database server.
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl --fail --silent --show-error \
                -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
                https://www.postgresql.org/media/keys/ACCC4CF8.asc
              . /etc/os-release
              printf '%s\n' "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/sc19-pgdg.list >/dev/null
              sudo apt-get update
            fi
            sudo apt-get install --yes --no-install-recommends "postgresql-client-$PG_MAJOR"
          fi
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_restore" --version
      - run: node scripts/sc-wer-c1-compose.mjs --check
      - run: node scripts/sc-ac-compose.mjs --check
      - run: node scripts/sc-c6-compose.mjs --check
      - run: node scripts/sc19-commerce-inventory-compose.mjs --check
      - run: node scripts/sc-c6-grant-guard-compose.mjs --check
      - run: node scripts/sc-c6-revision-compose.mjs --check
      - name: Catalog orders, settlement and erasure
        run: node --experimental-strip-types --test tests/sc19-catalog-orders.test.mjs
        env:
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
      - name: Real migration, concurrency, ACL, purge and native restore
        run: |
          set +e
          node --experimental-strip-types --test --test-concurrency=1 \
            tests/sc-019-migrations.test.mjs tests/sc-019-migrations-retention.test.mjs \
            tests/sc-019-migrations-mvp-e2e.test.mjs tests/preview-db-migrate-workflow.test.mjs \
            tests/competency-active-migration.test.mjs tests/competency-active-concurrency.test.mjs tests/competency-active-limiter.test.mjs tests/competency-active-staff.test.mjs \
            tests/assessment-center-active-database.test.mjs tests/assessment-center-active-concurrency.test.mjs \
            tests/exercise-ai-inventory.test.mjs tests/exercise-ai-concurrency.test.mjs \
            tests/exercise-ai-grant-guard.test.mjs tests/exercise-ai-grant-guard-concurrency.test.mjs \
            tests/exercise-ai-recruiter-api.test.mjs tests/exercise-ai-recruiter-api-concurrency.test.mjs \
            tests/exercise-ai-revision.test.mjs tests/exercise-ai-revision-concurrency.test.mjs \
            tests/exercise-ai-generation-database.test.mjs \
            tests/data-api-grants.test.mjs tests/sales-leads-database.test.mjs \
            tests/sc-step3-erasure-r7.test.mjs tests/sc-step4-erasure-r8.test.mjs tests/cv-bulk-database.test.mjs tests/sc-step3-evidence-worker.test.mjs \
            tests/sc-019-operator-fulfillment.test.mjs tests/sc19-auto-trial-database.test.mjs \
            tests/db-migrate/apply.test.mjs tests/db-migrate/inspect.test.mjs \
            tests/db-migrate/normalize-line-endings.test.mjs \
            > sc19-migrations.log 2>&1
          test_result=$?
          tail -n 250 sc19-migrations.log
          exit "$test_result"
        env:
          PREVIEW_MIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
          PG_DUMP_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump
          PG_RESTORE_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_restore
      - name: Preserve complete migration test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sc19-migrations-postgres-${{ matrix.postgres }}
          path: sc19-migrations.log
          if-no-files-found: warn
          retention-days: 7
  production-history:
    name: Production history / PostgreSQL ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgres: '16', image_tag: '16', label: '16' }
          - { postgres: '17', image_tag: '17', label: '17' }
          # Exact minor of production project wsvjawuikxfzjyivxgsu (PostgreSQL 17.6, 49 migrations; state read 2026-11-10).
          - { postgres: '17', image_tag: '17.6', label: '17.6-production' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Disposable native cluster with the observed pg_cron dependency
        env:
          PG_MAJOR: ${{ matrix.postgres }}
          PG_IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          docker build --build-arg PG_MAJOR="$PG_MAJOR" --build-arg PG_IMAGE_TAG="$PG_IMAGE_TAG" -t sc19-rehearsal -f tests/fixtures/sc19-rehearsal.Dockerfile tests/fixtures
          docker run -d --name sc19-rehearsal -p 127.0.0.1:55432:5432 \
            -e POSTGRES_USER=supabase_admin -e POSTGRES_PASSWORD=synthetic-only -e POSTGRES_DB=sc19_production_rehearsal \
            sc19-rehearsal -c shared_preload_libraries=pg_cron -c cron.database_name=sc19_production_rehearsal
          # The image entrypoint first runs a temporary init server on the Unix socket only,
          # then restarts. Probe over TCP so readiness means the final server, and retry the
          # version query until it answers (never treat a transient empty answer as a version).
          actual=''
          for attempt in $(seq 1 60); do
            if docker exec sc19-rehearsal pg_isready -h 127.0.0.1 -U supabase_admin -d sc19_production_rehearsal >/dev/null; then
              actual=$(docker exec -e PGPASSWORD=synthetic-only sc19-rehearsal psql -h 127.0.0.1 -U supabase_admin -d sc19_production_rehearsal -tAc 'show server_version' 2>/dev/null | awk '{print $1}') || actual=''
              [ -n "$actual" ] && break
            fi
            sleep 1
          done
          [ -n "$actual" ] || { echo "::error::rehearsal server did not become ready over TCP"; docker logs --tail 50 sc19-rehearsal; exit 1; }
          # Fail closed if the image or pg_cron install moved the server off the pinned version.
          echo "Rehearsal server_version: $actual (pinned tag: $PG_IMAGE_TAG)"
          case "$PG_IMAGE_TAG" in
            *.*) [ "$actual" = "$PG_IMAGE_TAG" ] || { echo "::error::expected PostgreSQL $PG_IMAGE_TAG, got $actual"; exit 1; } ;;
            *) case "$actual" in "$PG_IMAGE_TAG".*) ;; *) echo "::error::expected PostgreSQL $PG_IMAGE_TAG.x, got $actual"; exit 1 ;; esac ;;
          esac
      - name: Rehearse exact observed schema history, pending migrations and existing synthetic data
        env:
          SC19_REHEARSAL_DISPOSABLE: 'yes'
          SC19_REHEARSAL_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:55432/sc19_production_rehearsal
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
        run: |
          set -o pipefail
          node --test tests/sc-019-migrations-production-history.test.mjs 2>&1 | tee sc19-production-history.log
      - name: Rehearse the release from the CURRENT production state (49 recorded migrations, read 2026-11-10)
        env:
          SC19_REHEARSAL_DISPOSABLE: 'yes'
          SC19_CURRENT_REHEARSAL_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:55434/sc19_production_current
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
        run: |
          set -o pipefail
          # Third disposable cluster: roles are cluster-wide and pg_cron accepts one database per cluster,
          # so the legacy (2026-10-24) rehearsal above cannot share a cluster with this one.
          docker run -d --name sc19-current -p 127.0.0.1:55434:5432 \
            -e POSTGRES_USER=supabase_admin -e POSTGRES_PASSWORD=synthetic-only -e POSTGRES_DB=sc19_production_current \
            sc19-rehearsal -c shared_preload_libraries=pg_cron -c cron.database_name=sc19_production_current
          ready=''
          for attempt in $(seq 1 60); do
            if docker exec sc19-current pg_isready -h 127.0.0.1 -U supabase_admin -d sc19_production_current >/dev/null; then
              ready=$(docker exec -e PGPASSWORD=synthetic-only sc19-current psql -h 127.0.0.1 -U supabase_admin -d sc19_production_current -tAc 'select 1' 2>/dev/null) || ready=''
              [ "$ready" = 1 ] && break
            fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::current-state rehearsal server did not become ready over TCP"; docker logs --tail 50 sc19-current; exit 1; }
          node --test tests/sc-019-migrations-production-current.test.mjs 2>&1 | tee -a sc19-production-history.log
      - name: SC-WER r12 rollback from the state the release reaches after r12 (production history replay)
        env:
          SC19_REHEARSAL_DISPOSABLE: 'yes'
          SC19_R12_ROLLBACK_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:55435/sc19_r12_rollback
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
        run: |
          set -o pipefail
          # Fourth disposable cluster (cluster-wide roles, one pg_cron database per cluster).
          docker run -d --name sc19-r12 -p 127.0.0.1:55435:5432 \
            -e POSTGRES_USER=supabase_admin -e POSTGRES_PASSWORD=synthetic-only -e POSTGRES_DB=sc19_r12_rollback \
            sc19-rehearsal -c shared_preload_libraries=pg_cron -c cron.database_name=sc19_r12_rollback
          ready=''
          for attempt in $(seq 1 60); do
            if docker exec sc19-r12 pg_isready -h 127.0.0.1 -U supabase_admin -d sc19_r12_rollback >/dev/null; then
              ready=$(docker exec -e PGPASSWORD=synthetic-only sc19-r12 psql -h 127.0.0.1 -U supabase_admin -d sc19_r12_rollback -tAc 'select 1' 2>/dev/null) || ready=''
              [ "$ready" = 1 ] && break
            fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::r12 rollback rehearsal server did not become ready over TCP"; docker logs --tail 50 sc19-r12; exit 1; }
          node --test tests/sc-wer-r12-rollback-from-production.test.mjs 2>&1 | tee -a sc19-production-history.log
      - name: Reproduce the inspected production state (CRLF functions), normalization and M13
        if: matrix.postgres == '17'
        env:
          SC19_REHEARSAL_DISPOSABLE: 'yes'
          SC19_HOSTED_REHEARSAL_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:55433/sc19_production_hosted
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
        run: |
          set -o pipefail
          # Second disposable cluster: pg_cron accepts one database per cluster.
          docker run -d --name sc19-hosted -p 127.0.0.1:55433:5432 \
            -e POSTGRES_USER=supabase_admin -e POSTGRES_PASSWORD=synthetic-only -e POSTGRES_DB=sc19_production_hosted \
            sc19-rehearsal -c shared_preload_libraries=pg_cron -c cron.database_name=sc19_production_hosted
          ready=''
          for attempt in $(seq 1 60); do
            if docker exec sc19-hosted pg_isready -h 127.0.0.1 -U supabase_admin -d sc19_production_hosted >/dev/null; then
              ready=$(docker exec -e PGPASSWORD=synthetic-only sc19-hosted psql -h 127.0.0.1 -U supabase_admin -d sc19_production_hosted -tAc 'select 1' 2>/dev/null) || ready=''
              [ "$ready" = 1 ] && break
            fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::hosted rehearsal server did not become ready over TCP"; docker logs --tail 50 sc19-hosted; exit 1; }
          node --test tests/sc-019-migrations-production-hosted-state.test.mjs 2>&1 | tee -a sc19-production-history.log
      - name: Preserve rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc19-production-history-postgres-${{ matrix.label }}
          path: sc19-production-history.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only this job's disposable container
        if: always()
        run: docker rm -f sc19-rehearsal sc19-hosted sc19-current sc19-r12 || true
