name: SC-019 forward migrations
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'db/isolated/sc010-r4-voice-retention.sql'
      - 'docs/prototypes/sc-019-mvp-credits.sql'
      - 'docs/prototypes/sc19-payment-storage.sql'
      - 'docs/sc19-migrations*.md'
      - 'lib/sc19-payment*.ts'
      - 'tests/sc-019-migrations*.mjs'
      - 'tests/fixtures/sc19-migration-manifest.json'
      - 'tests/helpers/sc19-migration-fixture.mjs'
      - 'tests/helpers/screening-ranking-fixture.mjs'
      - 'tests/helpers/voice-retention-fixture.mjs'
      - '.github/workflows/sc19-migrations.yml'
  push:
    branches: [integration]
    paths:
      - 'supabase/migrations/**'
      - 'tests/sc-019-migrations*.mjs'
      - 'tests/fixtures/sc19-migration-manifest.json'
      - 'tests/helpers/sc19-migration-fixture.mjs'
      - '.github/workflows/sc19-migrations.yml'
permissions:
  contents: read
jobs:
  migration-contract:
    name: Migrations / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Matching native dump and restore clients
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          if [ ! -x "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "postgresql-client-$PG_MAJOR"
          fi
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_restore" --version
      - name: Real migration, concurrency, ACL, purge and native restore
        run: node --experimental-strip-types --test --test-concurrency=1 tests/sc-019-migrations.test.mjs tests/sc-019-migrations-retention.test.mjs
        env:
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SCREENING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SC19_TEST_PG_MAJOR: ${{ matrix.postgres }}
          PG_DUMP_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump
          PG_RESTORE_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_restore
