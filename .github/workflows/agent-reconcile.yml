name: Agent reconcile

on:
  schedule:
    - cron: "*/5 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: agent-control
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read-only reconcile
        if: vars.AGENT_PIPELINE_ENABLED != 'true'
        run: node tools/agent-pipeline/cli.mjs reconcile
        env:
          AGENT_PIPELINE_ENABLED: "false"
          AGENT_PIPELINE_MERGE_ENABLED: "false"
      - name: Live reconcile is configuration-gated
        if: vars.AGENT_PIPELINE_ENABLED == 'true'
        run: node tools/agent-pipeline/cli.mjs reconcile
        env:
          AGENT_PIPELINE_ENABLED: "true"
          AGENT_PIPELINE_MERGE_ENABLED: ${{ vars.AGENT_PIPELINE_MERGE_ENABLED }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
