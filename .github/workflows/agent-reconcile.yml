name: Agent reconcile

# One scheduler for both builder backends. Disabled flags prevent dispatch.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: agent-reconcile
  cancel-in-progress: false

jobs:
  authorize:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent-control-runtime') && (github.event_name == 'workflow_dispatch' || vars.AGENT_PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.source.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: source
        run: node tools/agent-pipeline/authorize-control-source.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  reconcile:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent-control-runtime') && (github.event_name == 'workflow_dispatch' || vars.AGENT_PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: agent-control
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read-only reconcile
        if: vars.AGENT_PIPELINE_ENABLED != 'true'
        run: node tools/agent-pipeline/cli.mjs reconcile
        env:
          AGENT_PIPELINE_ENABLED: "false"
          AGENT_PIPELINE_MERGE_ENABLED: "false"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AGENT_POLICY_COMMIT: ${{ github.sha }}
      - name: Live reconcile is configuration-gated
        if: vars.AGENT_PIPELINE_ENABLED == 'true'
        run: node tools/agent-pipeline/cli.mjs reconcile
        env:
          AGENT_PIPELINE_ENABLED: "true"
          AGENT_PIPELINE_MERGE_ENABLED: ${{ vars.AGENT_PIPELINE_MERGE_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AGENT_POLICY_COMMIT: ${{ github.sha }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_PIPELINE_APP_ID: ${{ secrets.AGENT_PIPELINE_APP_ID }}
          AGENT_PIPELINE_APP_PRIVATE_KEY: ${{ secrets.AGENT_PIPELINE_APP_PRIVATE_KEY }}
          AGENT_PIPELINE_APP_INSTALLATION_ID: ${{ secrets.AGENT_PIPELINE_APP_INSTALLATION_ID }}
