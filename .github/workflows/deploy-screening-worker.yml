# Deploys the Supabase Edge Function `screening-worker` to production from the
# current `main` revision. Manual only (workflow_dispatch). The job runs in the
# GitHub environment `production-approval`, so it starts only after the owner
# approves this exact run; the Supabase access token is a secret of that
# environment and is unavailable before the approval.
# Runbook: docs/release/deploy-screening-worker.md
name: Deploy screening-worker

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-screening-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy screening-worker / production
    # Never from a branch other than main, whatever the environment allows.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-approval
    permissions:
      contents: read
    env:
      PROJECT_REF: wsvjawuikxfzjyivxgsu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      # verify_jwt=false comes from supabase/config.toml; the worker checks HMAC itself.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not set in the production-approval environment"; exit 1; }
          supabase functions deploy screening-worker --project-ref "$PROJECT_REF"
      - name: Summary
        run: |
          {
            echo "### screening-worker deployed"
            echo "- revision: \`$GITHUB_SHA\` (main)"
            echo "- project: \`$PROJECT_REF\`"
            echo "- approved run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
