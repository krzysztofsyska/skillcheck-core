name: SC-019 MVP checks
on:
  push:
    branches: [feat/sc-019mvp-free-preselection]
  pull_request:
    paths:
      - 'docs/prototypes/sc-019-mvp-credits.sql'
      - 'tests/sc-019-billing-*.test.mjs'
      - 'lib/screening-flow.ts'
      - 'lib/supabase/database.types.ts'
      - 'app/dashboard/**/billing/**'
      - '.github/workflows/sc19-mvp.yml'
permissions:
  contents: read
jobs:
  credits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/sc-019-billing-prototype.test.mjs
      - run: node --test tests/sc-019-billing-concurrency.test.mjs
        env:
          SC19_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
