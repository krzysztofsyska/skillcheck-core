name: Voice provider offline tests
on:
  pull_request:
    paths:
      - 'lib/voice/provider.ts'
      - 'lib/voice/fake-provider.ts'
      - 'tests/voice-provider.test.mjs'
      - '.github/workflows/voice-provider-tests.yml'
  push:
    branches: [integration, main]
    paths:
      - 'lib/voice/provider.ts'
      - 'lib/voice/fake-provider.ts'
      - 'tests/voice-provider.test.mjs'
      - '.github/workflows/voice-provider-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/voice-provider.test.mjs
