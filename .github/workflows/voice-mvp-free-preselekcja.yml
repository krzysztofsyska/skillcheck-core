name: Voice MVP FREE PRESELEKCJA (offline)
on:
  pull_request:
    paths:
      - 'lib/voice/mvp-package-gate.ts'
      - 'tests/voice-mvp-package-gate.test.mjs'
      - '.github/workflows/voice-mvp-free-preselekcja.yml'
      - 'docs/sc-voice-mvp-free-preselekcja.md'
  push:
    branches: [feat/sc-voice-mvp-free-preselekcja-offline]
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/voice-mvp-package-gate.test.mjs tests/voice-provider.test.mjs tests/voice-interview-plan.test.mjs
      - run: npm run build
