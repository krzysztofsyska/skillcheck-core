name: Agent review

on:
  workflow_dispatch:
    inputs:
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      policy_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pr_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact: review-result.json
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.policy_sha }}
          persist-credentials: false
          path: trusted
      - name: Freeze diff as data
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: frozen
      - name: Record review inputs
        working-directory: frozen
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing non-SHA diff input" >&2
            exit 1
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > ../changed-files.txt
      - name: Codex review
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: trusted/.github/agent-pipeline/prompts/codex-review.md
          output-schema-file: trusted/.github/agent-pipeline/review-result.schema.json
          output-file: review-result.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-version: "0.160.1"
          working-directory: frozen
      - name: Wrap review envelope
        env:
          AGENT_POLICY_PATH: trusted/.github/agent-pipeline/policy.json
          POLICY_SHA: ${{ inputs.policy_sha }}
        run: node trusted/tools/agent-pipeline/wrap-review.mjs --payload review-result.json --out review-envelope.json
      - uses: actions/upload-artifact@v4
        with:
          name: sc-agent-review
          path: review-envelope.json

  publish:
    needs: model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.policy_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sc-agent-review
          path: artifact
      - name: Validate review artifact
        run: node tools/agent-pipeline/publish-review.mjs --artifact artifact/review-envelope.json --policy-sha "${{ inputs.policy_sha }}" --request-id "${{ inputs.request_id }}"
      - name: Publishing a check requires the controller app
        if: vars.AGENT_PIPELINE_ENABLED == 'true'
        run: echo "Check publication is performed by the controller app after SC-OPS-002C. This job does not merge."
