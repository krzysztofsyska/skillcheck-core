name: SC-021 AI gateway isolated checks
on:
  push:
    paths:
      - "lib/ai-gateway/**"
      - "tests/ai-gateway*"
      - "tests/sc021-r5-*"
      - "db/prototypes/sc021-ai-gateway-ledger.sql"
      - "db/prototypes/sc021-r5-anonymous-erasure.sql"
      - ".github/workflows/sc021-ai-gateway-tests.yml"
      - "package.json"
  pull_request:
    paths:
      - "lib/ai-gateway/**"
      - "tests/ai-gateway*"
      - "tests/sc021-r5-*"
      - "db/prototypes/sc021-ai-gateway-ledger.sql"
      - "db/prototypes/sc021-r5-anonymous-erasure.sql"
      - ".github/workflows/sc021-ai-gateway-tests.yml"
      - "package.json"
permissions:
  contents: read
jobs:
  sc021:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ai-gateway
        env:
          AI_GATEWAY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
