# Applies checked-in migrations to the TEST database skillcheck-preview
# (orbyscrupgnupifzlqxp) only. Never production: the job refuses any
# connection string that is not the preview project, and production
# migrations stay with db-migrate-production (owner approval).
#
# What runs: exactly the files listed in supabase/preview-migrations.txt, in
# that order, skipped when the preview ledger
# (supabase_migrations.schema_migrations) already has a migration of the same
# name with identical text. A listed file whose text changed after it reached
# preview fails the job (never a silent skip) unless its new sha256 is
# acknowledged in supabase/preview-resynced.txt after a manual resync (an
# acknowledgement covers exactly one new file hash, one previous ledger hash
# and only the newest ledger row).
# Each migration file carries its own transaction and preflight/postflight guards;
# its ledger row is inserted inside that same transaction.
#
# After the migrations, every file in supabase/preview-seeds/ is applied. Those
# are PREVIEW-ONLY commercial seeds (package quotas, the purchasable PRESELEKCJA
# offer) and deliberately NOT migrations: writing them from the migration chain
# would switch billing state on wherever the chain runs, production included,
# which is an owner action in /operator/billing (CLAUDE.md, AGENTS.md). They are
# idempotent and get no ledger row, so they are simply re-applied on every run,
# on top of whatever Preview testing has produced in the meantime. Each seed is
# handed the target project ref this job verified, and refuses to run without it.
#
# When: every push to `integration` or to a `preview-db/**` branch (a task
# branch pushed there to be tested on preview before review/merge). No paths
# filter: a new branch or a non-migration commit must still run; the job is
# idempotent (names already applied with identical text are skipped).
# Secret: PREVIEW_DATABASE_URL in the GitHub environment `preview-db`.
name: Preview DB migrate

on:
  push:
    branches:
      - integration
      - 'preview-db/**'

permissions: {}

concurrency:
  group: preview-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate skillcheck-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-db
    permissions:
      contents: read
    env:
      PREVIEW_REF: orbyscrupgnupifzlqxp
      PRODUCTION_REF: wsvjawuikxfzjyivxgsu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Apply listed migrations to preview
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "::error::PREVIEW_DATABASE_URL is not set in the preview-db environment"; exit 1; }
          case "$DATABASE_URL" in *"$PRODUCTION_REF"*) echo "::error::Refusing: connection string points at production"; exit 1;; esac
          case "$DATABASE_URL" in *"$PREVIEW_REF"*) ;; *) echo "::error::Refusing: connection string is not skillcheck-preview"; exit 1;; esac
          export PGCONNECT_TIMEOUT=15 PGSSLMODE=require
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "select 'connected to ' || current_database()"
          applied=0
          while IFS= read -r file || [ -n "$file" ]; do
            file="${file%%#*}"; file="$(echo "$file" | xargs)"
            [ -z "$file" ] && continue
            [[ "$file" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || { echo "::error::Invalid entry: $file"; exit 1; }
            path="supabase/migrations/$file"
            test -f "$path" || { echo "::error::Missing $path"; exit 1; }
            version="${file%%_*}"; name="${file#*_}"; name="${name%.sql}"
            done_count=$(psql "$DATABASE_URL" -qAt -v ON_ERROR_STOP=1 -v name="$name" <<'SQL'
          select count(*) from supabase_migrations.schema_migrations where name = :'name';
          SQL
            )
            body_sha=$(node scripts/preview-migration-stream.mjs hash "$path")
            if [ "$done_count" != "0" ]; then
              # A listed migration edited after it reached preview must never be skipped silently.
              ledger_sha=$(psql "$DATABASE_URL" -qAt -v ON_ERROR_STOP=1 -v name="$name" <<'SQL'
          select encode(sha256(convert_to(array_to_string(statements, ''), 'UTF8')), 'hex') from supabase_migrations.schema_migrations where name = :'name' order by version desc limit 1;
          SQL
              )
              if [ "$ledger_sha" = "$body_sha" ]; then echo "skip   $file (already applied)"; continue; fi
              # The acknowledgement names the ledger state it replaces, so an old line on another
              # branch can never move the ledger back from a newer resync.
              if grep -qxF "$body_sha  $file  $ledger_sha" supabase/preview-resynced.txt 2>/dev/null; then
                # Recorded manual resync (changed objects re-created on preview): store the current text.
                node scripts/preview-migration-stream.mjs resync "$path" | psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1
                echo "resync $file (acknowledged in supabase/preview-resynced.txt)"; continue
              fi
              echo "::error::$file changed after it was applied to preview (ledger $ledger_sha, file $body_sha). Re-create the changed objects on preview, then add \"$body_sha  $file  $ledger_sha\" to supabase/preview-resynced.txt."
              exit 1
            fi
            echo "apply  $file"
            # Migration and ledger row commit together: the ledger insert runs inside the file's own
            # transaction, just before its single closing `commit;`. A failure anywhere rolls back both,
            # and a successful migration can never be missing from the ledger (no re-apply on the next run).
            [ "$(grep -cE '^begin;[[:space:]]*$' "$path")" = "1" ] || { echo "::error::$file must open exactly one top-level begin;"; exit 1; }
            commit_line=$(grep -nE '^commit;[[:space:]]*$' "$path" | cut -d: -f1)
            last_line=$(grep -nvE '^[[:space:]]*$' "$path" | tail -1 | cut -d: -f1)
            [ -n "$commit_line" ] && [ "$commit_line" = "$last_line" ] || { echo "::error::$file must end with its only top-level commit;"; exit 1; }
            # Large SQL files travel only over stdin. Passing the ledger body with -v
            # exceeds Linux's per-argument limit before psql can execute anything.
            node scripts/preview-migration-stream.mjs apply "$path" | psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1
            applied=$((applied+1))
          done < supabase/preview-migrations.txt
          {
            echo "### skillcheck-preview migrations"
            echo "- revision: \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`)"
            echo "- applied now: $applied"
          } >> "$GITHUB_STEP_SUMMARY"
          # supabase/preview-seeds/** is NOT part of the migration chain. Package
          # quotas and a purchasable offer are owner-gated billing state
          # (/operator/billing, CLAUDE.md), so they must never be applied by a
          # migration that production would also run. These files exist only to
          # make the checkout walk possible on the test project; they run in this
          # same step, behind the production/preview refusal checked above.
          seeded=0
          for path in $(ls supabase/preview-seeds/*.sql 2>/dev/null | sort); do
            file="$(basename "$path")"
            [[ "$file" =~ ^[a-z0-9][a-z0-9-]*\.sql$ ]] || { echo "::error::Invalid seed entry: $file"; exit 1; }
            # Each seed carries its own single transaction and its own guards, and
            # is idempotent, so it is simply re-applied on every run: no ledger row
            # is written, because a seed is not a migration.
            [ "$(grep -cE '^begin;[[:space:]]*$' "$path")" = "1" ] || { echo "::error::$file must open exactly one top-level begin;"; exit 1; }
            commit_line=$(grep -nE '^commit;[[:space:]]*$' "$path" | cut -d: -f1)
            last_line=$(grep -nvE '^[[:space:]]*$' "$path" | tail -1 | cut -d: -f1)
            [ -n "$commit_line" ] && [ "$commit_line" = "$last_line" ] || { echo "::error::$file must end with its only top-level commit;"; exit 1; }
            echo "seed   $file"
            # The seed's own guard refuses to run unless the caller names the
            # target project, and this is the only place that has checked it
            # against the connection string (the refusals above). Without -v the
            # file fails on an unexpanded psql variable, which is the point.
            psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -v sc19_seed_target_ref="$PREVIEW_REF" -f "$path"
            seeded=$((seeded+1))
          done
          {
            echo "### skillcheck-preview seeds (preview-only, never production)"
            echo "- applied now: $seeded"
          } >> "$GITHUB_STEP_SUMMARY"
